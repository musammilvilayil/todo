<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#080b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudyForge" />
  <meta name="format-detection" content="telephone=no" />
  <title>StudyForge</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg:#080b12;--panel:#111722;--panel2:#151c28;--text:#f7f8fc;--muted:#9099aa;--line:#252c39;--violet:#7966ff;--cyan:#4bd8ff;--green:#52dfa3;--orange:#ffb45c;--red:#ff7182;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}body{padding-top:var(--safe-top);padding-bottom:calc(82px + var(--safe-bottom))}.app{max-width:760px;margin:auto;padding:16px}.hidden{display:none!important}.header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.4px;color:#7e8798;text-transform:uppercase}.title{font-size:30px;font-weight:900;letter-spacing:-1px;margin:3px 0}.sub{color:var(--muted);font-size:12px;line-height:1.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:11px;box-shadow:0 12px 34px rgba(0,0,0,.14)}.hero{display:flex;gap:14px;align-items:center}.hero-copy{flex:1}.hero h2{font-size:29px;margin:12px 0 7px;letter-spacing:-1px}.pill{display:inline-flex;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:900}.ring{width:88px;height:88px;border-radius:50%;border:7px solid var(--cyan);display:grid;place-items:center}.ring b{font-size:21px}.ring small{display:block;color:var(--muted);font-size:9px;text-align:center}.section{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.section h3{margin:2px 0 0;font-size:19px}.linkbtn,.ghost{border:0;background:transparent;color:#a7b6ff;font-weight:800;font-size:11px;padding:8px}.mode-row,.seg{display:flex;gap:7px}.mode,.chip{flex:1;border:1px solid var(--line);background:#0d121b;color:var(--text);border-radius:15px;padding:13px 8px;text-align:center;font-weight:800;font-size:11px}.mode.active,.chip.active{border-color:#5c4dd0;background:#18143b}.timeline{display:grid;grid-template-columns:58px 38px 1fr 24px;gap:10px;align-items:center;border:1px solid var(--line);background:#0d121b;border-radius:16px;padding:12px;margin-bottom:8px}.timeline.done{opacity:.52}.time{font-size:9px;color:#a2aabc;font-weight:800}.emoji{width:36px;height:36px;border-radius:11px;background:#121d2a;display:grid;place-items:center}.t-title{font-size:12px;font-weight:800}.note{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.45}.check{width:24px;height:24px;border:1px solid #414a5a;border-radius:50%;display:grid;place-items:center;font-size:12px}.done .check,.check.on{background:var(--green);border-color:var(--green);color:#06120c}.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}.prayer{background:#0d131d;border:1px solid var(--line);border-radius:13px;padding:9px 2px;text-align:center}.prayer.on{border-color:#285e49;background:#10251d}.prayer b{font-size:8px;display:block;margin-top:4px}.prayer small{font-size:7px;color:var(--muted)}.task{display:grid;grid-template-columns:25px 1fr 28px;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:13px;margin-bottom:8px}.task.done{opacity:.55}.task-meta{font-size:8px;color:#7f899b;font-weight:900;text-transform:uppercase}.task-title{font-size:13px;font-weight:800;margin-top:3px}.delete{border:0;background:none;color:#727b8c;font-size:24px}.btn{border:0;background:var(--violet);color:#fff;border-radius:14px;min-height:47px;padding:0 16px;font-weight:900}.btn.secondary{background:var(--panel2)}.btn.green{background:#1c7254}.btn.orange{background:#8a5a1c}.input{width:100%;border:1px solid var(--line);background:#121824;color:var(--text);border-radius:14px;min-height:48px;padding:12px 13px;font-size:15px;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.metric b{display:block;font-size:24px;margin:7px 0}.bar{height:5px;background:#252b36;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--cyan)}.timer{font-size:56px;font-weight:900;text-align:center;letter-spacing:-2px;margin:14px 0}.battery-top{display:flex;justify-content:space-between;gap:12px}.battery-num{font-size:42px;font-weight:900;letter-spacing:-2px}.status{font-size:10px;color:var(--green);font-weight:900}.todo-list{margin:12px 0 0;padding:0;list-style:none}.todo-list li{display:flex;gap:9px;border-top:1px solid var(--line);padding:11px 0;font-size:12px;line-height:1.45}.small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.mini{border:1px solid var(--line);background:#0d121b;border-radius:13px;padding:10px;text-align:center}.mini b{font-size:15px}.mini small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.nav{position:fixed;z-index:30;left:10px;right:10px;bottom:calc(8px + var(--safe-bottom));height:68px;max-width:740px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:21px;background:#0d121bf2;border:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#6d7689;border-radius:15px;font-size:8px;font-weight:800}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:#1a1735;color:var(--text)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-bottom));background:#171f2c;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:11px;z-index:50;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.install{border-color:#28465b;background:linear-gradient(135deg,#101923,#101722)}.install strong{font-size:15px}.offline{color:var(--orange)}.online{color:var(--green)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.space{height:6px}.material{cursor:pointer}.material h4{margin:3px 0 6px}.material.done{opacity:.52}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:#0c111a;border:1px solid var(--line);border-radius:27px 27px 0 0;padding:18px 18px calc(24px + var(--safe-bottom))}.sheet h3{font-size:24px;margin:0 0 13px}.sheet .btn{width:100%;margin-top:10px}.help{font-size:11px;color:var(--muted);line-height:1.55}.warning{color:#ffd08f}.health-history{font-size:10px;color:var(--muted);line-height:1.7}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:9px;color:var(--muted)}
    @media (display-mode:standalone){.install{display:none}}@media(max-width:390px){.app{padding:13px}.hero h2{font-size:25px}.ring{width:78px;height:78px}.prayer b{font-size:7px}.prayer small{font-size:6px}}
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <nav class="nav" id="nav"></nav>
  <div class="toast" id="toast"></div>
  <div id="modalRoot"></div>
<script>
const FULL=[['mern1','08:00','MERN Fundamentals','JavaScript, React, Node, Express & MongoDB','💻'],['code','10:15','Coding Practice','Small exercises without AI first','⌨️'],['project1','13:00','Build a Project Feature','Ship one real MERN feature','🛠️'],['marketing1','15:30','Digital Marketing Learning','Learn today’s marketing topic','📈'],['marketing2','17:00','Marketing Practical','Apply it to a real or sample business','🎯'],['project2','19:30','MERN Project & Debugging','Project work, debugging and GitHub','🚀'],['review','21:00','Revision & Notes','Review today and plan tomorrow','📚']].map(x=>({id:x[0],time:x[1],title:x[2],note:x[3],emoji:x[4]}));
const LIGHT=[{id:'light1',time:'09:00',title:'Light Revision',note:'Only weak or important concepts',emoji:'🌤️'},{id:'light2',time:'20:30',title:'Notes & Tomorrow Plan',note:'Keep today intentionally light',emoji:'📝'}];
const P=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const FALLBACK={Fajr:'05:05',Dhuhr:'12:25',Asr:'15:45',Maghrib:'18:35',Isha:'19:45'};
const MATERIALS=[['js','mern','JavaScript Core','Week 1','Functions, arrays, objects, promises and async/await.'],['react','mern','React Fundamentals','Week 1','Components, props, state, hooks and forms.'],['node','mern','Node + Express','Week 2','REST APIs, middleware, validation and error handling.'],['mongo','mern','MongoDB','Week 2','CRUD, schemas, indexes and aggregation.'],['auth','mern','Authentication','Week 3','JWT, hashing, roles and protected routes.'],['deploy','mern','Deployment','Week 4','Production builds, environment variables and debugging.'],['fund','marketing','Marketing Fundamentals','Week 1','Audience, funnel, offer, CTA and metrics.'],['social','marketing','Social Media','Week 1','Content pillars, hooks, captions and engagement.'],['seo','marketing','SEO','Week 2','Search intent, keyword research and on-page SEO.'],['meta','marketing','Meta Ads','Week 3','Objectives, audiences, creatives and retargeting.'],['gads','marketing','Google Ads','Week 3','Search campaigns, keywords, ads and conversions.'],['analytics','marketing','Analytics + Copywriting','Week 4','CTR, CPC, CPA, ROAS, hooks and CTAs.']].map(x=>({id:x[0],kind:x[1],title:x[2],week:x[3],note:x[4]}));
const KEY='studyforge_pwa_v1';
const initial={tab:'today',materialTab:'mern',dayModes:{},checks:{},prayerChecks:{},prayerTimes:{},materialDone:{},focusMinutes:0,tasks:[{id:'t1',title:'Build a React mini project',type:'Assignment',category:'MERN',done:false},{id:'t2',title:'JavaScript fundamentals check',type:'Assessment',category:'MERN',done:false},{id:'t3',title:'Create a 7-day content calendar',type:'Assignment',category:'Marketing',done:false},{id:'t4',title:'Weekly review',type:'Task',category:'Review',done:false}],battery:{percent:76,charging:false,maxTarget:80,lightTarget:70,offTarget:60,lowThreshold:30,chargeRate:55,health:'',cycles:'',healthHistory:[],travelDate:null}};
let S=load();let focus={preset:50,seconds:3000,running:false,id:null};
function keyFor(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{return Object.assign(structuredClone(initial),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function mins(t){let[h,m]=t.split(':').map(Number);return h*60+m}function pretty(t){let[h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function mode(){return S.dayModes[keyFor()]||'study'}function base(){return mode()==='off'?[]:mode()==='light'?LIGHT:FULL}function prayers(){return S.prayerTimes[keyFor()]||FALLBACK}function checks(){return S.checks[keyFor()]||{}}function pchecks(){return S.prayerChecks[keyFor()]||{}}
function modeTarget(){let b=S.battery;if(b.travelDate===keyFor())return 100;if(mode()==='light')return Math.min(b.maxTarget,b.lightTarget);if(mode()==='off')return Math.min(b.maxTarget,b.offTarget);return b.maxTarget}
function batteryPlan(){let b=S.battery,p=Number(b.percent)||0,t=modeTarget(),items=[];if(b.charging){if(p>=t)items.push(`Unplug now — today’s target is ${t}%.`);else{let m=Math.ceil((t-p)/(Math.max(10,b.chargeRate)/60));let d=new Date(Date.now()+m*60000);items.push(`Keep charging about ${m} min · unplug around ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}.`);items.push('Light use while charging is okay; avoid heat-heavy gaming/video export.')}}else{if(p<=20)items.push(`Plug in now. Try not to stay below 20% for long.`);else if(p<b.lowThreshold)items.push(`Top-up recommended before the next long study block.`);else if(p>=t)items.push(`No charge needed now. You already have today’s ${t}% target.`);else items.push(`No urgent charge. Top-up later if you expect a long session.`)}
let tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);let tm=S.dayModes[keyFor(tomorrow)]||'study';let tt=tm==='off'?Math.min(b.maxTarget,b.offTarget):tm==='light'?Math.min(b.maxTarget,b.lightTarget):b.maxTarget;let predicted=Math.max(0,p-4);let need=Math.max(0,tt-predicted),mm=Math.ceil(need/(Math.max(10,b.chargeRate)/60));let start=new Date();start.setDate(start.getDate()+1);start.setHours(tm==='light'?9:tm==='off'?10:8,0,0,0);start=new Date(start.getTime()-mm*60000);items.push(`Tomorrow: ${tm==='study'?'Study':tm==='light'?'Light':'Off'} Day · target ${tt}% · if needed, plug around ${start.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}.`);return items}
function timeline(){let ps=P.map(n=>({id:'p-'+n,time:prayers()[n],title:n+' Namaz',note:'Protected prayer time',emoji:'🕌',prayer:n}));return [...base(),...ps,{id:'chat',time:'22:00',title:'Chat / Personal Time',note:'Protected from study until sleep',emoji:'💬'}].sort((a,b)=>mins(a.time)-mins(b.time))}
function studyPct(){let b=base(),c=checks();return mode()==='off'?100:b.length?Math.round(b.filter(x=>c[x.id]).length/b.length*100):0}function matPct(kind){let a=MATERIALS.filter(x=>x.kind===kind);return Math.round(a.filter(x=>S.materialDone[x.id]).length/a.length*100)}function taskPct(){return S.tasks.length?Math.round(S.tasks.filter(x=>x.done).length/S.tasks.length*100):0}
function section(e,t,a=''){return `<div class="section"><div><div class="eyebrow">${e}</div><h3>${t}</h3></div>${a}</div>`}
function render(){renderNav();let app=document.getElementById('app');app.innerHTML=S.tab==='today'?today():S.tab==='plan'?plan():S.tab==='tasks'?tasks():S.tab==='learn'?learn():progress();bind()}
function installCard(){let standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;if(standalone)return '';return `<div class="card install"><div class="eyebrow">INSTALL</div><strong>Make StudyForge feel like an app 📲</strong><p class="sub">Safari → Share → <b>Add to Home Screen</b>. After first load, the core app works offline too.</p></div>`}
function today(){let m=mode(),pct=studyPct(),next=timeline().find(x=>mins(x.time)>=new Date().getHours()*60+new Date().getMinutes()),pc=pchecks();return `<div class="header"><div><div class="eyebrow">${new Date().toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}</div><div class="title">StudyForge</div></div><span class="badge ${navigator.onLine?'online':'offline'}">${navigator.onLine?'● Online':'● Offline'}</span></div>${installCard()}<div class="card"><div class="hero"><div class="hero-copy"><span class="pill">${m==='study'?'STUDY DAY':m==='light'?'LIGHT DAY':'OFF DAY'}</span><h2>${m==='off'?'Rest without guilt.':m==='light'?'Keep it light.':'Build. Learn. Grow.'}</h2><div class="sub">MERN + Digital Marketing with protected prayer and personal time.</div><div class="eyebrow" style="margin-top:15px">NEXT</div><div class="sub">${next?pretty(next.time)+' · '+next.title:'Day complete ✓'}</div></div><div class="ring"><div><b>${pct}%</b><small>today</small></div></div></div></div>${batteryCard()}<div class="card"><div class="section" style="margin:0"><div><div class="eyebrow">NAMAZ</div><h3>Five daily prayers</h3></div><button class="linkbtn" data-action="prayer-update">📍 Update</button></div><div class="prayers">${P.map(n=>`<button class="prayer ${pc[n]?'on':''}" data-prayer="${n}">${pc[n]?'✓':'🕌'}<b>${n}</b><small>${pretty(prayers()[n])}</small></button>`).join('')}</div></div>${section('TODAY',m==='off'?'Rest day':'Your flow','<button class="linkbtn" data-tab="plan">Day mode</button>')}${m==='off'?`<div class="card" style="text-align:center"><div style="font-size:38px">🌴</div><h3>Official Off Day</h3><div class="sub">No study schedule today. Your streak is protected.</div></div>`:timeline().map(t=>timelineRow(t)).join('')}${section('PRIORITY','Must finish','<button class="linkbtn" data-tab="tasks">All tasks</button>')}${S.tasks.filter(x=>!x.done).slice(0,3).map(taskRow).join('')}`}
function batteryCard(){let b=S.battery,t=modeTarget(),plan=batteryPlan();return `<div class="card"><div class="battery-top"><div><div class="eyebrow">BATTERY CARE PLANNER</div><div class="battery-num">${b.percent}%</div><div class="status">${b.charging?'⚡ Charging':'🔋 Unplugged'} · Target ${t}%</div></div><button class="btn secondary" style="height:42px;min-height:42px" data-action="battery-edit">Update</button></div><ul class="todo-list">${plan.map((x,i)=>`<li><span>${i===0?'⚡':'○'}</span><span>${x}</span></li>`).join('')}</ul><div class="small-grid"><div class="mini"><b>${b.maxTarget}%</b><small>MAX TARGET</small></div><div class="mini"><b>${b.chargeRate}%/h</b><small>CHARGE RATE</small></div><div class="mini"><b>${b.health||'—'}${b.health?'%':''}</b><small>BATTERY HEALTH</small></div></div></div>`}
function timelineRow(t){let d=t.prayer?!!pchecks()[t.prayer]:!!checks()[t.id];return `<button class="timeline ${d?'done':''}" data-timeline="${t.id}" data-prayer-name="${t.prayer||''}"><div class="time">${pretty(t.time)}</div><div class="emoji">${t.emoji}</div><div style="text-align:left"><div class="t-title">${t.title}</div><div class="note">${t.note}</div></div><div class="check">${d?'✓':''}</div></button>`}
function taskRow(t){return `<div class="task ${t.done?'done':''}"><button class="check ${t.done?'on':''}" data-task-toggle="${t.id}">${t.done?'✓':''}</button><div><div class="task-meta">${esc(t.type)} · ${esc(t.category)}</div><div class="task-title">${esc(t.title)}</div></div><button class="delete" data-task-delete="${t.id}">×</button></div>`}
function plan(){let m=mode(),b=S.battery;return `<div class="eyebrow">PLANNER</div><div class="title">Shape the day</div><p class="sub">Study Day, Light Day or completely Off.</p><div class="card"><div class="mode-row">${[['study','⚡️','Study Day'],['light','🌤️','Light Day'],['off','🌴','Off Day']].map(x=>`<button class="mode ${m===x[0]?'active':''}" data-mode="${x[0]}"><div style="font-size:23px">${x[1]}</div>${x[2]}</button>`).join('')}</div></div><div class="card"><div class="eyebrow">BATTERY TARGETS</div><h3>Charging strategy</h3><p class="sub">Study ${b.maxTarget}% · Light ${Math.min(b.maxTarget,b.lightTarget)}% · Off ${Math.min(b.maxTarget,b.offTarget)}%. Travel mode can temporarily use 100%.</p><div class="seg">${[80,85,90,100].map(x=>`<button class="chip ${b.maxTarget===x?'active':''}" data-target="${x}">${x}%</button>`).join('')}</div><button class="btn ${b.travelDate===keyFor()?'orange':'secondary'}" style="width:100%;margin-top:10px" data-action="travel">${b.travelDate===keyFor()?'Travel 100% enabled today':'Travel / long day → 100% today'}</button></div><div class="card"><div class="eyebrow">PERSONAL TIME</div><h3>10 PM → Sleep 💬</h3><p class="sub">No study sessions are placed after 10 PM.</p></div><div class="card"><div class="eyebrow">OFFLINE</div><h3>Works without your laptop</h3><p class="sub">After installing to Home Screen and opening once online, schedules, tasks, focus timer and Battery Care data are cached locally. Location prayer refresh needs internet.</p></div>`}
function tasks(){return `<div class="header"><div><div class="eyebrow">WORK</div><div class="title">Tasks & assessments</div></div><button class="btn" data-action="task-add">＋</button></div>${S.tasks.map(taskRow).join('')}`}
function learn(){let list=MATERIALS.filter(x=>x.kind===S.materialTab);return `<div class="eyebrow">LEARN</div><div class="title">Study library</div><div class="seg" style="margin:12px 0">${['mern','marketing'].map(x=>`<button class="chip ${S.materialTab===x?'active':''}" data-material-tab="${x}">${x==='mern'?'MERN':'Marketing'}</button>`).join('')}</div>${list.map(x=>`<div class="card material ${S.materialDone[x.id]?'done':''}" data-material="${x.id}"><div class="eyebrow">${x.week}</div><h4>${x.title}</h4><div class="sub">${x.note}</div><div class="check ${S.materialDone[x.id]?'on':''}" style="margin-top:10px">${S.materialDone[x.id]?'✓':''}</div></div>`).join('')}`}
function progress(){let m=matPct('mern'),d=matPct('marketing'),t=taskPct();return `<div class="eyebrow">ANALYTICS</div><div class="title">Your progress</div><div class="grid2">${[['Today',studyPct()],['MERN',m],['Marketing',d],['Tasks',t]].map(x=>`<div class="metric"><span class="sub">${x[0]}</span><b>${x[1]}%</b><div class="bar"><div class="fill" style="width:${x[1]}%"></div></div></div>`).join('')}</div><div class="card" style="margin-top:11px"><div class="eyebrow">FOCUS</div><h3>Deep work timer</h3><div class="timer" id="timer">${timerText()}</div><div class="seg">${[25,50,90].map(x=>`<button class="chip ${focus.preset===x?'active':''}" data-focus-preset="${x}">${x}m</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" data-action="focus">${focus.running?'Pause focus':'Start focus'}</button><p class="sub" style="text-align:center">Logged: ${S.focusMinutes||0} focused minutes</p></div><div class="card"><div class="eyebrow">BATTERY HEALTH LOG</div><h3>${S.battery.health?S.battery.health+'% health':'No health reading saved'}</h3><p class="sub">Cycle count: ${S.battery.cycles||'—'} · Add readings from iPhone Settings when you check them.</p><button class="btn secondary" data-action="battery-edit">Update battery log</button><div class="health-history">${(S.battery.healthHistory||[]).slice(-5).reverse().map(x=>`${x.date} · ${x.health}% · ${x.cycles||'—'} cycles`).join('<br>')||'No history yet.'}</div></div>`}
function timerText(){return `${String(Math.floor(focus.seconds/60)).padStart(2,'0')}:${String(focus.seconds%60).padStart(2,'0')}`}
function renderNav(){document.getElementById('nav').innerHTML=[['today','⌂','Today'],['plan','▣','Plan'],['tasks','✓','Tasks'],['learn','◆','Learn'],['progress','↗','Progress']].map(x=>`<button class="${S.tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{S.tab=e.dataset.tab;save();render()});document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{S.dayModes[keyFor()]=e.dataset.mode;save();render()});document.querySelectorAll('[data-timeline]').forEach(e=>e.onclick=()=>{let id=e.dataset.timeline,p=e.dataset.prayerName;if(id==='chat'){toast('Personal time protected 💬');return}if(p){S.prayerChecks[keyFor()]={...pchecks(),[p]:!pchecks()[p]}}else{S.checks[keyFor()]={...checks(),[id]:!checks()[id]}}save();render()});document.querySelectorAll('[data-prayer]').forEach(e=>e.onclick=()=>{let p=e.dataset.prayer;S.prayerChecks[keyFor()]={...pchecks(),[p]:!pchecks()[p]};save();render()});document.querySelectorAll('[data-task-toggle]').forEach(e=>e.onclick=()=>{let t=S.tasks.find(x=>x.id===e.dataset.taskToggle);if(t)t.done=!t.done;save();render()});document.querySelectorAll('[data-task-delete]').forEach(e=>e.onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==e.dataset.taskDelete);save();render()});document.querySelectorAll('[data-material-tab]').forEach(e=>e.onclick=()=>{S.materialTab=e.dataset.materialTab;save();render()});document.querySelectorAll('[data-material]').forEach(e=>e.onclick=()=>{let id=e.dataset.material;S.materialDone[id]=!S.materialDone[id];save();render()});document.querySelectorAll('[data-target]').forEach(e=>e.onclick=()=>{S.battery.maxTarget=Number(e.dataset.target);save();render()});document.querySelectorAll('[data-focus-preset]').forEach(e=>e.onclick=()=>{stopFocus();focus.preset=Number(e.dataset.focusPreset);focus.seconds=focus.preset*60;render()});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=actions[e.dataset.action]);}
const actions={
 'prayer-update':async()=>{if(!navigator.geolocation)return toast('Location unavailable');toast('Getting prayer times…');navigator.geolocation.getCurrentPosition(async pos=>{try{let d=new Date(),date=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;let r=await fetch(`https://api.aladhan.com/v1/timings/${date}?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=1`);let j=await r.json(),t=j.data.timings;S.prayerTimes[keyFor()]={Fajr:t.Fajr.slice(0,5),Dhuhr:t.Dhuhr.slice(0,5),Asr:t.Asr.slice(0,5),Maghrib:t.Maghrib.slice(0,5),Isha:t.Isha.slice(0,5)};save();render();toast('Prayer times updated ✓')}catch{toast('Could not update prayer times')}},()=>toast('Location permission needed'))},
 'task-add':()=>modal(`<h3>Add task</h3><input class="input" id="taskName" placeholder="e.g. Build JWT authentication"><div class="row" style="margin-top:8px"><input class="input" id="taskCat" placeholder="MERN"><select class="input" id="taskType"><option>Task</option><option>Assignment</option><option>Assessment</option></select></div><button class="btn" id="saveTask">Save task</button><button class="btn secondary" data-close>Cancel</button>`,()=>{document.getElementById('saveTask').onclick=()=>{let v=document.getElementById('taskName').value.trim();if(!v)return;S.tasks.push({id:String(Date.now()),title:v,type:document.getElementById('taskType').value,category:document.getElementById('taskCat').value.trim()||'Other',done:false});save();closeModal();render()}}),
 'battery-edit':()=>{let b=S.battery;modal(`<h3>Battery Care 🔋</h3><div class="row"><div><div class="eyebrow">CURRENT %</div><input class="input" id="bp" type="number" min="1" max="100" value="${b.percent}"></div><div><div class="eyebrow">STATE</div><select class="input" id="bc"><option value="0" ${!b.charging?'selected':''}>Unplugged</option><option value="1" ${b.charging?'selected':''}>Charging</option></select></div></div><div class="space"></div><div class="row"><div><div class="eyebrow">HEALTH %</div><input class="input" id="bh" type="number" min="1" max="100" value="${b.health}"></div><div><div class="eyebrow">CYCLE COUNT</div><input class="input" id="cy" type="number" min="0" value="${b.cycles}"></div></div><div class="space"></div><div class="eyebrow">EST. CHARGE SPEED % / HOUR</div><input class="input" id="cr" type="number" min="10" max="100" value="${b.chargeRate}"><p class="help">Safari cannot read live iPhone battery level. Quick-update this when you want a fresh charging plan.</p><button class="btn" id="saveBattery">Save & recalculate</button><button class="btn secondary" data-close>Cancel</button>`,()=>{document.getElementById('saveBattery').onclick=()=>{let oldHealth=b.health;b.percent=Math.max(1,Math.min(100,Number(document.getElementById('bp').value)||b.percent));b.charging=document.getElementById('bc').value==='1';b.health=document.getElementById('bh').value;b.cycles=document.getElementById('cy').value;b.chargeRate=Math.max(10,Math.min(100,Number(document.getElementById('cr').value)||55));if(b.health&&b.health!==oldHealth)b.healthHistory.push({date:keyFor(),health:b.health,cycles:b.cycles});save();closeModal();render();toast('Battery plan recalculated ✓')}})},
 'travel':()=>{S.battery.travelDate=S.battery.travelDate===keyFor()?null:keyFor();save();render()},
 'focus':()=>{focus.running?stopFocus():startFocus();render()}
};
function modal(html,onopen){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet">${html}</div></div>`;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);if(onopen)onopen()}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function startFocus(){focus.running=true;focus.id=setInterval(()=>{focus.seconds--;let e=document.getElementById('timer');if(e)e.textContent=timerText();if(focus.seconds<=0){stopFocus();S.focusMinutes=(S.focusMinutes||0)+focus.preset;save();focus.seconds=focus.preset*60;toast('Focus complete 🔥');render()}},1000)}function stopFocus(){focus.running=false;if(focus.id)clearInterval(focus.id);focus.id=null}
window.addEventListener('online',render);window.addEventListener('offline',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
