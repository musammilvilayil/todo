<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#080b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="StudyForge" />
  <title>StudyForge</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root{--bg:#080b12;--panel:#111722;--panel2:#151c28;--text:#f7f8fc;--muted:#9099aa;--line:#252c39;--violet:#7966ff;--cyan:#4bd8ff;--green:#52dfa3;--orange:#ffb45c;--red:#ff7182;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}body{padding-top:var(--safe-top);padding-bottom:calc(82px + var(--safe-bottom))}.app{max-width:760px;margin:auto;padding:16px}.hidden{display:none!important}
    .header,.ai-row,.switchrow,.section{display:flex;align-items:center;justify-content:space-between;gap:12px}.header{margin:2px 0 14px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.35px;color:#7e8798;text-transform:uppercase}.title{font-size:30px;font-weight:900;letter-spacing:-1px;margin:4px 0}.sub,.note{color:var(--muted);line-height:1.5}.sub{font-size:12px}.note{font-size:10px}.card,.ai-box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:11px}.ai-box{background:linear-gradient(145deg,#161532,#111722);border-color:#35315d}.hero{display:flex;gap:14px;align-items:center}.hero-copy{flex:1}.hero h2{font-size:26px;margin:10px 0 7px;letter-spacing:-.7px}.pill{display:inline-flex;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:900}.pill.ai{border-color:#8f80ff;color:#aa9fff}.section{align-items:end;margin:18px 2px 10px}.section h3{margin:2px 0 0;font-size:19px}.linkbtn,.ghost{border:0;background:transparent;color:#a7b6ff;font-weight:800;font-size:11px;padding:8px}.btn{border:0;background:var(--violet);color:#fff;border-radius:14px;min-height:47px;padding:0 16px;font-weight:900}.btn.secondary{background:var(--panel2)}.btn.green{background:#1c7254}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#121824;color:var(--text);border-radius:14px;min-height:48px;padding:12px 13px;font-size:15px;outline:none}.textarea{min-height:86px;resize:vertical}.label{display:block;font-size:9px;font-weight:900;letter-spacing:1.1px;color:#8690a2;margin:15px 0 7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips,.mode-row{display:flex;flex-wrap:wrap;gap:7px}.chip,.mode{border:1px solid var(--line);background:#0d121b;color:var(--text);border-radius:14px;padding:11px 12px;text-align:center;font-weight:800;font-size:11px}.chip.active,.mode.active{border-color:#6656dd;background:#1b1741}.switch{width:52px;height:31px;border:0;border-radius:999px;background:#262d38;padding:3px}.switch i{display:block;width:25px;height:25px;background:white;border-radius:50%;transition:.2s}.switch.on{background:#2d7b5c}.switch.on i{transform:translateX(21px)}
    .timeline{display:grid;grid-template-columns:64px 40px 1fr 54px;gap:10px;align-items:center;border:1px solid var(--line);background:#0d121b;border-radius:17px;padding:12px;margin-bottom:8px}.timeline.done{opacity:.52}.timeline.locked{border-color:#4b456d}.timeline.live-active{border-color:#3b7c68;background:#0d1816}.timeline.live-paused{border-color:#8a6b32;background:#1a160e}.time{font-size:9px;color:#a2aabc;font-weight:900}.emoji{width:38px;height:38px;border-radius:12px;background:#121d2a;display:grid;place-items:center;font-size:18px}.task-meta{font-size:8px;color:#7f899b;font-weight:900;text-transform:uppercase}.t-title{font-size:13px;font-weight:850;margin-top:3px}.check{width:26px;height:26px;border:1px solid #414a5a;background:transparent;color:#08120e;border-radius:50%;display:grid;place-items:center}.check.on{background:var(--green);border-color:var(--green)}.task-actions{display:flex;flex-direction:column;align-items:stretch;gap:4px}.mini-action,.move-action{border:0;border-radius:9px;padding:6px 7px;font-size:8px;font-weight:900;color:white;background:#4439a5}.mini-action.pause{background:#7b5a1d}.mini-action.resume{background:#1f7857}.move-action{background:#202733;color:#aeb7c7}.passive-mark{display:grid;place-items:center;color:#778195}.live-mini{font-size:13px;font-weight:900;color:#72e9c0;margin-top:5px}.task{display:grid;grid-template-columns:28px 1fr 28px;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:13px;margin-bottom:8px}.task.done{opacity:.5}.delete{border:0;background:none;color:#727b8c;font-size:24px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.metric b{display:block;font-size:24px;margin:7px 0}.bar{height:5px;background:#252b36;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--cyan)}.timer{font-size:56px;font-weight:900;text-align:center;letter-spacing:-2px;margin:14px 0}.battery-num{font-size:42px;font-weight:900;letter-spacing:-2px}
    .prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}.prayer{border:1px solid var(--line);background:#0d131d;color:var(--text);border-radius:13px;padding:9px 2px;text-align:center}.prayer.on{border-color:#285e49;background:#10251d}.prayer b{font-size:8px;display:block;margin-top:4px}.prayer small{font-size:7px;color:var(--muted)}
    .today-overview{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:11px}.overview-big{font-size:42px;font-weight:900;letter-spacing:-2px}.overview-side{display:grid;grid-template-columns:auto auto;gap:3px 8px;align-content:center}.overview-side b{font-size:14px}.overview-side span{font-size:9px;color:var(--muted)}.overview-bar{grid-column:1/-1;height:6px;border-radius:99px;background:#252b36;overflow:hidden}.overview-bar div{height:100%;background:var(--cyan)}.live-card{background:linear-gradient(145deg,#10251e,#101722);border:1px solid #2f6f57;border-radius:24px;padding:18px;margin-bottom:12px}.live-card.paused{background:linear-gradient(145deg,#241d10,#111722);border-color:#765c28}.live-title{font-size:21px;font-weight:900;margin-top:6px}.live-clock{font-size:44px;font-weight:900;letter-spacing:-2px;margin:9px 0}.live-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:9px;margin-bottom:10px}.live-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}.compact-section{margin-top:14px}.simple-home .title{margin-bottom:0}.prayer-line{border-color:#244b3d}
    .nav{position:fixed;z-index:30;left:10px;right:10px;bottom:calc(8px + var(--safe-bottom));height:68px;max-width:740px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:21px;background:#0d121bf2;border:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#6d7689;border-radius:15px;font-size:8px;font-weight:800}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:#1a1735;color:var(--text)}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-bottom));background:#171f2c;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:11px;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}.toast.show{opacity:1}
    .onboarding{padding-bottom:40px}.onboard-card{max-width:680px;margin:auto}.steps{display:flex;gap:6px;margin:14px 0}.step-dot{height:5px;flex:1;background:#242b37;border-radius:99px}.step-dot.on{background:var(--violet)}.hour-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.hour{border:1px solid var(--line);background:#0d121b;color:#6f7889;border-radius:11px;min-height:42px;font-size:10px;font-weight:900}.hour.active{background:#173127;color:#baf7dc;border-color:#2e7055}.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}.daytab{border:1px solid var(--line);background:#0d121b;color:#788195;border-radius:12px;padding:10px 2px;font-size:9px;font-weight:900}.daytab.active{border-color:#6759d6;color:#fff;background:#1a173b}.daytab.off{opacity:.35}.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.preset{border:1px solid var(--line);background:#131a25;color:#aab1c0;border-radius:11px;padding:9px 4px;font-size:9px;font-weight:800}.availability-summary{font-size:10px;color:#aab3c2;margin-top:10px;line-height:1.55}.wizard-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:14px}.wizard-actions .btn{width:100%}
    .modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:#0c111a;border:1px solid var(--line);border-radius:27px 27px 0 0;padding:18px 18px calc(24px + var(--safe-bottom))}.sheet h3{font-size:24px;margin:0 0 13px}
    @media(max-width:420px){.app{padding:13px}.hour-grid{grid-template-columns:repeat(4,1fr)}.timeline{grid-template-columns:57px 36px 1fr 50px;gap:8px}.hero h2{font-size:23px}.title{font-size:27px}.live-clock{font-size:38px}}
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <nav class="nav hidden" id="nav"></nav>

  <div id="modalRoot"></div>
  <script src="./app.js"></script>
  <script src="./scheduler-v32.js"></script>
  <script src="./live-day-v33.js"></script>

</body>
</html>
